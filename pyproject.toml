[project]
name = "jev-sentinel"
version = "0.1.0"
description = "AI Coding Agent Guardian — verification and governance layer"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "JEV Sentinel Team" }]
keywords = ["ai", "governance", "git", "verification", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.0",
  "psycopg[binary]>=3.1.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pyyaml>=6.0.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "docker>=7.1.0",
  "gitpython>=3.1.43",
  "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "types-pyyaml",
  "faker>=25.0.0",
]

[project.urls]
Homepage = "https://github.com/sohamRaorane/OP"
Repository = "https://github.com/sohamRaorane/OP"
Issues = "https://github.com/sohamRaorane/OP/issues"

[project.scripts]
jev-sentinel = "sentinel.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "S", "Q"]
ignore = [
  "S101",   # assert allowed in tests
  "S603",   # subprocess list-args (we use shell=False + allowlist)
  "S607",   # partial executable path
  "S105",   # hardcoded password — false positives on enum names like PASS
  "S104",   # binding 0.0.0.0 — intentional for containerized API
  "B008",   # function call in default arg (FastAPI Depends pattern)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017"]  # blind exception asserts are intentional when testing error paths

[tool.mypy]
python_version = "3.12"
namespace_packages = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --cov=sentinel --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["src/sentinel"]
branch = true

[tool.alembic]
script_location = "alembic"
