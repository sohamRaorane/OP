services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      SENTINEL_ENV: production
      DATABASE_URL: postgresql+psycopg://sentinel:sentinel@db:5432/sentinel
      LOG_LEVEL: INFO
      SENTINEL_MODE: gated
      DOCKER_ENABLED: "true"
      SANDBOX_IMAGE: jev-sentinel-sandbox:latest
      # Snapshots must resolve to the SAME path on the host — the docker daemon
      # mounts them into sandbox containers by host path
      SNAPSHOT_DIR: ${SNAPSHOT_HOST_DIR:-/var/lib/jev-snapshots}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SNAPSHOT_HOST_DIR:-/var/lib/jev-snapshots}:${SNAPSHOT_HOST_DIR:-/var/lib/jev-snapshots}
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Validation sandbox runs as ephemeral containers created via the socket.
  # Build the tooled sandbox image once (tools are baked in, network is off at runtime):
  #   docker build -f docker/sandbox.Dockerfile -t jev-sentinel-sandbox:latest .

volumes:
  postgres_data:
